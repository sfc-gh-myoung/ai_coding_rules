name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Job 1: Code Quality (parallel)
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v8.0.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          cache-suffix: ${{ github.job }}

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Run lint
        run: uv run ai-rules dev quality lint

      - name: Run format check
        run: uv run ai-rules dev quality format

      - name: Run type check
        run: uv run ai-rules dev quality typecheck

  # Job 2: Markdown Linting (parallel)
  markdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v8.0.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          cache-suffix: ${{ github.job }}

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Lint markdown
        run: uv run ai-rules dev quality markdown

  # Job 3: Tests with Python Matrix (parallel)
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v8.0.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          cache-suffix: ${{ matrix.python-version }}

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Run tests
        run: uv run ai-rules dev test run

  # Job 3b: Coverage gate (single interpreter, parallel)
  #
  # Deliberately separate from the matrix above. Coverage roughly doubles the
  # run, and a matrix would enforce the threshold once per interpreter with
  # potentially different numbers. Pinned to 3.12 so the enforced figure is
  # deterministic. `fail_under` in pyproject.toml is what actually fails here.
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v8.0.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Enforce coverage threshold
        run: uv run ai-rules dev test run --coverage

  # Job 4: Rules Validation (parallel)
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v8.0.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          cache-suffix: ${{ github.job }}

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Validate rule schemas
        run: uv run ai-rules validate rules/

      - name: Validate rule loader fixtures
        run: uv run ai-rules rule-loader validate

      - name: Verify plugin build is source-faithful
        run: |
          A="$(mktemp -d)"
          trap 'rm -rf "$A"' EXIT

          uv run ai-rules plugin build --plugin-dir "$A"

          # The load-bearing check: the build copies rules/*.md, so assert that
          # set reaches the plugin complete and byte-identical. Stated in terms
          # of *.md rather than as a `diff -r` with an exclusion list, because an
          # exclusion list silently rots — a new rules/ cache file or dotfile
          # would fail the gate for a non-defect.
          #
          # `plugin build` already asserts the artifact contract
          # (check_artifacts) and exits non-zero on a missing or undeclared
          # artifact, so `plugin verify` is not re-run here. Also deliberately
          # not checked: a second build diffed against the first (same
          # deterministic function, same source, same commit — cannot fail), and
          # the vendored match_rules.py diffed against its own copy source.
          diff <(cd rules && ls *.md | sort) <(cd "$A/rules" && ls *.md | sort)
          for f in rules/*.md; do
            cmp "$f" "$A/rules/$(basename "$f")"
          done
