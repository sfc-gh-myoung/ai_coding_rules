name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Job 1: Code Quality (parallel)
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v8.0.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          cache-suffix: ${{ github.job }}

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Run lint
        run: uv run ai-rules dev quality lint

      - name: Run format check
        run: uv run ai-rules dev quality format

      - name: Run type check
        run: uv run ai-rules dev quality typecheck

  # Job 2: Markdown Linting (parallel)
  markdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v8.0.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          cache-suffix: ${{ github.job }}

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Lint markdown
        run: uv run ai-rules dev quality markdown

  # Job 3: Tests with Python Matrix (parallel)
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v8.0.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          cache-suffix: ${{ matrix.python-version }}

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Run tests
        run: uv run ai-rules dev test run

  # Job 4: Rules Validation (parallel)
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v8.0.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          cache-suffix: ${{ github.job }}

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Validate rule schemas
        run: uv run ai-rules validate rules/

      - name: Check RULES_INDEX.md is current
        run: uv run ai-rules index check

      - name: Check rule references resolve
        run: uv run ai-rules refs check

      - name: Verify AGENTS.md is rendered from templates (no drift)
        run: |
          rm -rf /tmp/agents-render && mkdir -p /tmp/agents-render
          uv run ai-rules deploy --agents-dest /tmp/agents-render
          diff -u AGENTS.md /tmp/agents-render/AGENTS.md

      - name: Validate rule loader fixtures
        run: uv run ai-rules rule-loader validate
