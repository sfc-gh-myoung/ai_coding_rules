name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Job 1: Code Quality (parallel)
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: '3.x'

      - name: Install uv
        uses: astral-sh/setup-uv@v8.0.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          cache-suffix: ${{ github.job }}

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: task env:sync

      - name: Run lint
        run: task quality:lint

      - name: Run format check
        run: task quality:format

      - name: Run type check
        run: task quality:typecheck

  # Job 2: Markdown Linting (parallel)
  markdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: '3.x'

      - name: Install uv
        uses: astral-sh/setup-uv@v8.0.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          cache-suffix: ${{ github.job }}

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: task env:sync

      - name: Lint markdown
        run: task quality:markdown

  # Job 3: Tests with Python Matrix (parallel)
  test:
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    strategy:
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v5

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: '3.x'

      - name: Install uv
        uses: astral-sh/setup-uv@v8.0.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          cache-suffix: ${{ matrix.python-version }}

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: task env:sync

      - name: Run tests
        run: task test:run

  # Job 3b: Coverage gate (single interpreter, parallel)
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: '3.x'

      - name: Install uv
        uses: astral-sh/setup-uv@v8.0.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: task env:sync

      - name: Enforce coverage threshold
        run: task test:coverage

  # Job 4: Rules Validation (parallel)
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: '3.x'

      - name: Install uv
        uses: astral-sh/setup-uv@v8.0.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          cache-suffix: ${{ github.job }}

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: task env:sync

      - name: Validate schemas
        run: task validate:schemas

      - name: Validate rule loader contracts
        run: task validate:rule-loader

      - name: Verify plugin replicas and build fidelity
        # Manifest-driven, so this step cannot fall behind the copy set. The
        # previous hand-rolled version diffed only the matcher and rules/*.md,
        # leaving the other seven copied artifacts unverified.
        #
        # `plugin sync --check` covers the tracked in-repo replicas; `plugin
        # verify` asserts every emitted artifact is present, declared, and
        # byte-identical to its primary. Both derive from
        # src/ai_rules/plugin/replicas.py, which is also what `task plugin:verify`
        # runs locally, so local and CI enforce the same contract.
        run: task plugin:verify

  automation:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        task-version: ['3.45.0', '3.53.1']
    steps:
      - uses: actions/checkout@v5
      - uses: arduino/setup-task@v2
        with:
          version: ${{ matrix.task-version }}
      - uses: astral-sh/setup-uv@v8.0.0
        with:
          python-version: '3.12'
      - name: Install shell checks on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y shellcheck shfmt
      - name: Install shell checks on macOS
        if: runner.os == 'macOS'
        run: brew install shellcheck shfmt
      - run: task env:sync
      - run: task quality:automation
      - run: task test:automation
