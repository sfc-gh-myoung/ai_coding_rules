name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Job 1: Code Quality (parallel)
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v8.0.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          cache-suffix: ${{ github.job }}

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Run lint
        run: uv run ai-rules dev quality lint

      - name: Run format check
        run: uv run ai-rules dev quality format

      - name: Run type check
        run: uv run ai-rules dev quality typecheck

  # Job 2: Markdown Linting (parallel)
  markdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v8.0.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          cache-suffix: ${{ github.job }}

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Lint markdown
        run: uv run ai-rules dev quality markdown

  # Job 3: Tests with Python Matrix (parallel)
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v8.0.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          cache-suffix: ${{ matrix.python-version }}

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Run tests
        run: uv run ai-rules dev test run

  # Job 4: Rules Validation (parallel)
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v8.0.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          cache-suffix: ${{ github.job }}

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Validate rule schemas
        run: uv run ai-rules validate rules/

      - name: Validate rule loader fixtures
        run: uv run ai-rules rule-loader validate

      - name: Verify plugin build is reproducible and source-faithful
        run: |
          A="$(mktemp -d)"; B="$(mktemp -d)"
          trap 'rm -rf "$A" "$B"' EXIT

          # Two independent builds from identical source must agree.
          # Replaces the old `git diff --exit-code ai-coding-rules-plugin/` gate,
          # which became vacuous once that path was gitignored.
          uv run ai-rules plugin build --plugin-dir "$A"
          uv run ai-rules plugin build --plugin-dir "$B"
          diff -r "$A" "$B"

          # Vendored matcher must match canonical source exactly.
          diff -q src/ai_rules/match_rules.py "$A/skills/rule-loader/scripts/match_rules.py"

          # Completeness by content, not cardinality. rules/ holds non-.md entries
          # (.index-stats.json, examples/) that the build correctly does not copy.
          diff <(cd rules && ls *.md | sort) <(cd "$A/rules" && ls *.md | sort)
          diff -r -x '.index-stats.json' -x 'examples' rules "$A/rules"

          # Artifact contract, asserted from EXPECTED_ARTIFACTS/EXPECTED_TREES.
          # Fails on a missing artifact AND on undeclared output.
          uv run ai-rules plugin verify --plugin-dir "$A"
