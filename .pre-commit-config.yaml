repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: ty
        name: ty type check
        entry: uv run ty check .
        language: system
        pass_filenames: false
        types_or: [python, pyi]
        stages: [pre-commit]

      - id: sync-plugin-replicas
        name: Sync plugin replicas
        entry: scripts/sync_plugin_replicas.sh
        language: script
        pass_filenames: false
        # Scoped to the primaries whose replicas are generated. Listing the
        # replica too means a hand-edit of the generated copy is also caught.
        files: ^(src/ai_rules/match_rules\.py|skills/rule-loader/scripts/match_rules\.py)$
        stages:
          - pre-commit

      - id: entro-secret-scan
        name: Entro Secret Scan
        entry: scripts/entro_secret_scan.sh
        language: script
        pass_filenames: false
        always_run: true
        stages:
          - pre-commit
        args:
          - --fail-on-findings
