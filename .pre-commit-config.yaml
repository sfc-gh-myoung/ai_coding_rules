repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: ty
        name: ty type check
        entry: uv run ty check .
        language: system
        pass_filenames: false
        types_or: [python, pyi]
        stages: [pre-commit]

      - id: entro-secret-scan
        name: Entro Secret Scan
        entry: scripts/entro_secret_scan.sh
        language: script
        pass_filenames: false
        always_run: true
        stages:
          - pre-commit
        args:
          - --fail-on-findings
