# AI Coding Rules - Development Automation
# Docs: docs/USING_DEV_CLI.md
# Supported platforms: macOS (darwin), Linux
version: '3.45'

set: [pipefail]

vars:
  UV: '{{.UV | default "uv"}}'
  PYTHON_VERSION: '{{.PYTHON_VERSION | default .UV_PYTHON | default "3.12"}}'
  UV_RUN: '{{.UV | shellQuote}} run --locked --python {{.PYTHON_VERSION | shellQuote}}'
  MARKDOWN_RULES_TARGETS: ['rules/']
  MARKDOWN_DOCS_TARGETS: ['docs/', 'README.md', 'CONTRIBUTING.md', 'CHANGELOG.md']

env:
  PYTHONDONTWRITEBYTECODE: '1'

tasks:
  default:
    desc: Show categorized tasks
    silent: true
    deps: [check:uv]
    cmds:
      - '{{.UV_RUN}} python scripts/dev_info.py help'

  check:uv:
    internal: true
    run: once
    preconditions:
      - sh: 'command -v {{.UV | shellQuote}}'
        msg: 'uv not found. Install from https://docs.astral.sh/uv/ or set UV to its executable path.'

  env:setup:
    desc: Pin Python and create .venv
    deps: [check:uv]
    cmds:
      - '{{.UV | shellQuote}} python install {{.PYTHON_VERSION | shellQuote}}'
      - '{{.UV | shellQuote}} python pin {{.PYTHON_VERSION | shellQuote}}'
      - '{{.UV | shellQuote}} venv --python {{.PYTHON_VERSION | shellQuote}}'

  env:sync:
    desc: Sync locked development dependencies
    deps: [check:uv]
    cmds:
      - '{{.UV | shellQuote}} sync --locked --python {{.PYTHON_VERSION | shellQuote}} --no-group live-agent'

  env:sync:live:
    desc: Opt in to locked live-agent dependencies
    deps: [check:uv]
    cmds:
      - '{{.UV | shellQuote}} sync --locked --python {{.PYTHON_VERSION | shellQuote}} --group live-agent'

  env:lock:
    desc: Update lockfile and sync development dependencies
    deps: [check:uv]
    cmds:
      - '{{.UV | shellQuote}} lock'
      - task: env:sync

  quality:all:
    desc: Run Python, Markdown, and automation checks
    cmds:
      - task: quality:lint
      - task: quality:format
      - task: quality:typecheck
      - task: quality:markdown
      - task: quality:automation

  quality:all:fix:
    desc: Apply Python and Markdown fixes, then check all quality gates
    cmds:
      - task: quality:lint:fix
      - task: quality:format:fix
      - task: quality:markdown:fix
      - task: quality:all

  quality:lint:
    desc: Run Ruff linter without fixes
    deps: [check:uv]
    cmds:
      - '{{.UV_RUN}} ruff check .'

  quality:lint:fix:
    desc: Apply Ruff lint fixes
    deps: [check:uv]
    cmds:
      - '{{.UV_RUN}} ruff check --fix .'

  quality:format:
    desc: Check Python formatting
    deps: [check:uv]
    cmds:
      - '{{.UV_RUN}} ruff format --check .'

  quality:format:fix:
    desc: Apply Python formatting
    deps: [check:uv]
    cmds:
      - '{{.UV_RUN}} ruff format .'

  quality:typecheck:
    desc: Run ty type checker
    deps: [check:uv]
    cmds:
      - '{{.UV_RUN}} ty check .'

  quality:markdown:
    desc: Check rules and documentation Markdown
    deps: [check:uv]
    cmds:
      - '{{.UV_RUN}} pymarkdownlnt --config pymarkdown.rules.json scan {{range .MARKDOWN_RULES_TARGETS}}{{. | shellQuote}} {{end}}'
      - '{{.UV_RUN}} pymarkdownlnt --config pymarkdown.docs.json scan {{range .MARKDOWN_DOCS_TARGETS}}{{. | shellQuote}} {{end}}'

  quality:markdown:fix:
    desc: Fix rules and documentation Markdown
    deps: [check:uv]
    cmds:
      - '{{.UV_RUN}} pymarkdownlnt --config pymarkdown.rules.json fix {{range .MARKDOWN_RULES_TARGETS}}{{. | shellQuote}} {{end}}'
      - '{{.UV_RUN}} pymarkdownlnt --config pymarkdown.docs.json fix {{range .MARKDOWN_DOCS_TARGETS}}{{. | shellQuote}} {{end}}'

  quality:automation:
    desc: Validate Task schema, shell syntax, lint, and formatting
    deps: [check:uv]
    preconditions:
      - sh: command -v shellcheck
        msg: Install ShellCheck to validate automation scripts.
      - sh: command -v shfmt
        msg: Install shfmt to check shell formatting.
    cmds:
      - task --list-all --json > /dev/null
      - '{{.UV_RUN}} check-jsonschema --builtin-schema vendor.taskfile Taskfile.yml'
      - shellcheck -x -P scripts scripts/maintainer-common.sh scripts/release.sh scripts/mirror.sh scripts/clean.sh scripts/plugin-verify.sh
      - shfmt -d -i 2 -ci scripts/maintainer-common.sh scripts/release.sh scripts/mirror.sh scripts/clean.sh scripts/plugin-verify.sh

  test:run:
    desc: Run pytest tests with the selected Python
    deps: [check:uv]
    cmds:
      - '{{.UV_RUN}} pytest tests/ --tb=short {{.CLI_ARGS}}'

  test:automation:
    desc: Test automation using disposable repositories and command stubs
    deps: [check:uv]
    cmds:
      - '{{.UV_RUN}} pytest tests/automation/ tests/test_version_consistency.py --tb=short'

  test:coverage:
    desc: Run tests and enforce coverage threshold
    deps: [check:uv]
    cmds:
      - '{{.UV_RUN}} pytest --cov=src/ai_rules --cov-report=term-missing --cov-report=html tests/'

  test:coverage:open:
    desc: Run coverage and open HTML report on macOS
    platforms: [darwin]
    cmds:
      - task: test:coverage
      - open htmlcov/index.html

  validate:
    desc: Full validation including coverage and rule-loader contracts
    aliases: [ci]
    summary: |
      Run all quality gates, coverage tests, schemas, rule-loader checks, and plugin fidelity.
      Matches hosted checks for one selected interpreter. Hosted CI also tests Python 3.13
      and automation on macOS/Linux with Task 3.45.0 and Task 3.53.1.
      No Task fingerprints suppress validation. Cortex loader validation is optional;
      use plugin:verify:strict when Cortex must be present.
    cmds:
      - task: status:preflight
      - task: quality:all
      - task: test:coverage
      - task: validate:schemas
      - task: validate:rule-loader
      - task: plugin:verify

  validate:schemas:
    desc: Validate rule, example, template, and skill schemas
    deps: [check:uv]
    cmds:
      - '{{.UV_RUN}} ai-rules validate rules/'
      - '{{.UV_RUN}} ai-rules validate rules/examples/ --examples'
      - '{{.UV_RUN}} ai-rules validate templates/ --templates'
      - '{{.UV_RUN}} ai-rules validate-skills skills/'

  validate:rule-loader:
    desc: Validate fixtures, corpus reachability, and trigger-count contract
    deps: [check:uv]
    cmds:
      - '{{.UV_RUN}} ai-rules rule-loader validate'
      - '{{.UV_RUN}} ai-rules rule-loader audit --fail-on-miss'
      - '{{.UV_RUN}} ai-rules rule-loader validate-trigger-contract'

  plugin:verify:
    desc: Check plugin fidelity; check Cortex loader when installed
    deps: [check:uv]
    cmds:
      - 'UV={{.UV | shellQuote}} UV_PYTHON={{.PYTHON_VERSION | shellQuote}} bash scripts/plugin-verify.sh optional'

  plugin:verify:strict:
    desc: Check plugin fidelity and require Cortex loader validation
    deps: [check:uv]
    preconditions:
      - sh: command -v cortex
        msg: Cortex CLI is required. Install it or use plugin:verify for optional loader validation.
    cmds:
      - 'UV={{.UV | shellQuote}} UV_PYTHON={{.PYTHON_VERSION | shellQuote}} bash scripts/plugin-verify.sh required'

  eval:
    desc: Run informational reviewer eval tests
    deps: [check:uv]
    cmds:
      - '{{.UV_RUN}} pytest tests/reviewer_eval/ -q --tb=short'

  clean:cache:
    desc: Remove project caches and Task fingerprints, excluding virtual environments
    cmds:
      - bash scripts/clean.sh cache

  clean:venv:
    desc: Remove .venv with confirmation or FORCE=1
    summary: 'Prompts on a terminal. Use task clean:venv FORCE=1 for non-interactive removal.'
    cmds:
      - 'FORCE={{.FORCE | default "0" | shellQuote}} bash scripts/clean.sh venv'

  clean:all:
    desc: Confirm once, then remove project caches and .venv
    summary: 'Refuses without confirmation before any deletion. Use task clean:all FORCE=1 for non-interactive removal.'
    cmds:
      - 'FORCE={{.FORCE | default "0" | shellQuote}} bash scripts/clean.sh all'

  status:show:
    desc: Show project counts and the selected interpreter
    silent: true
    deps: [check:uv]
    cmds:
      - 'UV={{.UV | shellQuote}} {{.UV_RUN}} python scripts/dev_info.py status'

  status:preflight:
    desc: Check uv availability and lockfile consistency
    deps: [check:uv]
    preconditions:
      - sh: test -f pyproject.toml && test -f uv.lock
        msg: pyproject.toml and uv.lock must exist in the project root.
    cmds:
      - '{{.UV | shellQuote}} lock --check'
      - echo 'uv is available and the project lockfile is consistent.'

  release:bump:
    desc: Validate, bump version, sign commit, and push the release branch
    requires:
      vars: [VERSION]
    summary: |
      Requires clean release/vX.Y.Z and VERSION=X.Y.Z. Stable releases only.
      Updates pyproject.toml, runtime version, README badge, and uv.lock; runs ci before commit/push.
      Preview: task release:bump VERSION=X.Y.Z DRY_RUN=1 (no writes or network).
      Recovery: docs/USING_DEV_CLI.md. Never rerun blindly after a commit or push failure.
    cmds:
      - 'UV={{.UV | shellQuote}} UV_PYTHON={{.PYTHON_VERSION | shellQuote}} DRY_RUN={{.DRY_RUN | default "0" | shellQuote}} bash scripts/release.sh bump {{.VERSION | shellQuote}}'

  release:merge:
    desc: Validate isolated squash merge, sign, push atomically, and create draft release
    requires:
      vars: [VERSION]
    summary: |
      Requires clean release/vX.Y.Z, matching remote branch, and unused tag vX.Y.Z.
      Uses an isolated worktree; stops on conflicts; leaves local main unchanged.
      Preview: task release:merge VERSION=X.Y.Z DRY_RUN=1 (no writes or network).
      Failed merges retain their worktree. Recovery: docs/USING_DEV_CLI.md.
    cmds:
      - 'UV={{.UV | shellQuote}} UV_PYTHON={{.PYTHON_VERSION | shellQuote}} DRY_RUN={{.DRY_RUN | default "0" | shellQuote}} bash scripts/release.sh merge {{.VERSION | shellQuote}}'

  mirror:sync:
    desc: Mirror the committed local main tree with a signed parentless commit and lease
    summary: |
      Uses local main, never your current feature branch. Configure exactly one gitlab push URL.
      Does not fetch main automatically: review/synchronize main before invoking.
      Does not switch branches or alter the working tree. Rejects concurrent remote changes.
      Preview: task mirror:sync DRY_RUN=1. Recovery: docs/USING_DEV_CLI.md.
    cmds:
      - 'DRY_RUN={{.DRY_RUN | default "0" | shellQuote}} bash scripts/mirror.sh'