schema_version: 4
updated: '2026-07-20T13:00:00-04:00'
id: behavioral-docs-only-no-code
description: Verifies agent does not run code validation tools when the task is documentation-only
variant: behavioral
prompt: 'What should the README.md say to document the new --retry-infra flag we added to the eval command?

  '
expected:
  required:
  - rules/000-global-core.md
  forbidden: []
  optional: []
trigger_evidence:
  kw:
  - README
  - document
  - update
  ext:
  - .md
  file:
  - README.md
  dir: []
behavioral_checks:
- id: no-code-validation
  description: Agent does not run pytest or ruff for a docs-only change
  rule_source: rules/000-global-core.md
  check_type: tool_call_absent
  tool: Bash
  pattern: pytest|ruff|mypy|pylint
- id: documents-flag
  description: Agent includes the --retry-infra flag in its output
  rule_source: rules/000-global-core.md
  check_type: output_pattern
  pattern: --retry-infra
architecture_mode: both
