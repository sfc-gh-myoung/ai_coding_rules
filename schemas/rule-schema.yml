# YAML Schema for AI Coding Rules v4.0
# ==============================================================================
# Purpose: Compact, action-first rule authoring and validation contract
# Usage: ai-rules validate rules/NNN-rule.md
#
# Migration note (v3.4 → v3.5):
# - YAML frontmatter is now the canonical metadata format; inline **Field:**
#   format is still accepted during rollout (dual-parse mode).
# - `## Metadata` H2 header is no longer required (frontmatter fence replaces it).
# - `### Dependencies` prose subsection is no longer required in References;
#   dependency data lives in frontmatter `depends:` with per-item YAML
#   comment justifications.
# - Keywords count bound set to a combined 5-11 typed entries (kw:/ext:/file:/dir:).
#   Advisory shape within that hard bound: 2-4 structural (ext:/file:/dir:) plus
#   5-7 semantic (kw:). `--count` controls the semantic count only.
# ==============================================================================

$schema: "http://json-schema.org/draft-07/schema#"
version: "4.0"
description: "Action-first rules: Scope, Contract, References; four required Contract subsections; positive examples on demand. Metadata discovery remains compatible. Semantic authoring requirements are reviewed separately from structural validation."
last_updated: "2026-09-16"

authoring_contract:
  enforcement: "Manual review; this block is not consumed by SchemaValidator. Structural checks below apply immediately, regardless of a rule's declared version."
  migration: "Migrate rule bodies and governance/templates together before declaring v4.0 conformance. Existing v3.x declarations remain parseable, not exempt from active structural checks."
  sources:
    - "https://agentskills.io/specification"
    - "https://platform.claude.com/docs/en/agents-and-tools/agent-skills/best-practices"
    - "https://developers.openai.com/api/docs/guides/prompt-engineering"
  requirements:
    - "State applicability and exclusions once; preserve discovery metadata without repeating its summary verbatim."
    - "Keep task-specific constraints in Mandatory; keep shared safety constraints in their required owner."
    - "Write condition, action, and observable result. Define fallback or escalation where failure changes safety or correctness."
    - "Use exact values from a specification or project configuration; label local defaults and their rationale. Do not invent thresholds to replace judgment."
    - "Match procedural detail to operational risk. Use ordered steps only for sequences; do not pad to a step count."
    - "State required output shape in Validation or an optional Output Format subsection. Keep one completion checklist, not a duplicate Post-Execution Checklist."
    - "Preserve authorization, data boundaries, non-idempotent retry handling, and ownership-scoped recovery when compressing."
    - "Show correct examples only, with inputs, prerequisites, and expected outcomes. Cite defects without including incorrect executable examples."
    - "Use no more than three correct examples per rule; add one only when it resolves a distinct ambiguity. Do not include incorrect executable examples, generic tutorials, or duplicates."
    - "Keep each operational rules/*.md file within 250 physical lines; move nonessential detail to a focused companion or primary documentation without dropping essential safety instructions."
    - "Link to focused primary documentation for external claims. Distinguish product requirements, repository policy, and unverified assumptions."
    - "For optional resources, name the load condition and exact path; retain essential safety instructions in the active contract."
    - "Keep references shallow and dependency ownership acyclic. Measure the loaded dependency closure, not just individual file size."
    - "Use Markdown structures that preserve meaning; format restrictions are repository policy, not proof of universal model limitations."
    - "Compare representative tasks before and after compression; verify discovery, required reads, outputs, and failure handling. Static schema success is not behavioral proof."

# ==============================================================================
# METADATA VALIDATION RULES
# ==============================================================================
metadata:
  description: "Validation rules for file metadata fields"
  
  required_fields:
    - name: "SchemaVersion"
      format: "**SchemaVersion:**"
      yaml_key: "schema_version"
      type: "string"
      pattern: "^v\\d+\\.\\d+(\\.\\d+)?$"
      error_message: "SchemaVersion must be a version string (e.g., v4.0)"
      fix_suggestion: "Set schema_version: v4.0 after migrating to the active contract"
      severity: "CRITICAL"
      docs_reference: "002-rule-governance.md Section 11.1"
    
    - name: "RuleVersion"
      format: "**RuleVersion:**"
      yaml_key: "rule_version"
      type: "string"
      pattern: "^v\\d+\\.\\d+\\.\\d+$"
      error_message: "RuleVersion must be semantic version format (e.g., v1.0.0)"
      fix_suggestion: "Add **RuleVersion:** v1.0.0 (or appropriate version)"
      severity: "HIGH"
      docs_reference: "002-rule-governance.md Section 11.1"
    
    - name: "LastUpdated"
      format: "**LastUpdated:**"
      yaml_key: "last_updated"
      type: "string"
      pattern: "^\\d{4}-\\d{2}-\\d{2}$"
      error_message: "LastUpdated must be date format YYYY-MM-DD (e.g., 2025-12-23)"
      fix_suggestion: "Add **LastUpdated:** YYYY-MM-DD with current date"
      severity: "HIGH"
      docs_reference: "002-rule-governance.md Section 11.1"
      description: "Timestamp for last significant update. Provides temporal context for troubleshooting when RuleVersion and SchemaVersion alone are insufficient. Helps identify when breaking changes occurred and track rule maintenance history."
    
    - name: "Keywords"
      format: "**Keywords:**"
      yaml_key: "keywords"
      type: "array"
      min_items: 5
      max_items: 11
      item_type: "string"
      separator: ", "
      pattern: "^(kw:[a-z0-9][a-z0-9 _.-]*|ext:\\.[a-z0-9]+|file:[A-Za-z0-9_.+-]+|dir:[A-Za-z0-9_/-]+/?)$"
      description: "Typed-prefix keywords for rule discovery (schema v3.6). Four prefixes: kw: (semantic keyword, lowercase), ext: (file extension, e.g. ext:.py), file: (specific filename, e.g. file:Dockerfile), dir: (directory path, e.g. dir:tests/). All entries count toward the combined 5-11 minimum/maximum (advisory shape within that hard bound: 2-4 structural ext:/file:/dir: plus 5-7 semantic kw:). Foundation rules use kw: prefixes only (no ext:/file:/dir:)."
      error_message: "Keywords entries must use a typed prefix (kw:, ext:, file:, dir:) and total 5-11 entries (combined)."
      fix_suggestion: "Use typed prefixes on every entry. Example: kw:python, ext:.py, file:pyproject.toml. Currently {actual} entries (need {min}-{max})."
      severity: "HIGH"
      docs_reference: "002-rule-governance.md Section 11.1"
    
    - name: "TokenBudget"
      format: "**TokenBudget:**"
      yaml_key: "token_budget"
      type: "string"
      pattern: "^~[0-9]+$"
      accuracy_tolerance: 0.10  # ±10% of actual word count
      error_message: "TokenBudget must be format ~NUMBER (e.g., ~1500)"
      fix_suggestion: "Update to: ~{calculated_value}"
      severity: "MEDIUM"
      docs_reference: "002-rule-governance.md Section 11.1"
    
    - name: "ContextTier"
      format: "**ContextTier:**"
      yaml_key: "context_tier"
      type: "enum"
      allowed_values: ["Critical", "High", "Medium", "Low"]
      error_message: "ContextTier must be one of: Critical, High, Medium, Low"
      fix_suggestion: "Choose appropriate tier based on rule importance"
      severity: "HIGH"
      docs_reference: "002-rule-governance.md Section 11.1"
      description: "Secondary priority signal for context management. Primary preservation mechanism is natural language importance markers (CRITICAL/CORE/FOUNDATION) that work universally across all LLMs. ContextTier helps agents make fine-grained decisions within priority tiers. All four values remain valid and enforced by schema."
    
    - name: "Depends"
      format: "**Depends:**"
      yaml_key: "depends"
      type: "array"
      min_items: 0
      item_type: "string"
      pattern: "^(required|optional):[a-zA-Z0-9_-]+\\.md$"
      check_file_exists: true
      allow_placeholders: ["None", "-", "-"]
      error_message: "Depends entries must use 'required:FILENAME.md' or 'optional:FILENAME.md' (or 'None' for foundation rules)"
      fix_suggestion: "Prefix each entry with required: or optional:. Example: required:000-global-core.md, optional:200-python-core.md"
      severity: "HIGH"
      docs_reference: "002-rule-governance.md Section 11.1"
  
  # Optional metadata fields (deprecated in v3.3 — LoadTrigger merged into Keywords)
  optional_fields: []

  field_order:
    required: true
    order: ["SchemaVersion", "RuleVersion", "LastUpdated", "Keywords", "TokenBudget", "ContextTier", "Depends"]
    optional_after: []
    error_message: "Metadata fields must appear in order: SchemaVersion, RuleVersion, LastUpdated, Keywords, TokenBudget, ContextTier, Depends"
    fix_suggestion: "Reorder metadata fields per Section 11.1 of 002-rule-governance.md"
    severity: "HIGH"
    docs_reference: "002-rule-governance.md Section 11.1"
  
  placement:
    # v3.5: YAML frontmatter (`---` fenced block) MUST appear at the very top of
    # the file (line 1). Inline `**Field:**` format (v3.4 fallback) still permitted
    # before the Scope section during dual-parse rollout.
    frontmatter_fence_at_top: true
    before_section: "Scope"
    error_message: "Metadata must appear as YAML frontmatter at top-of-file, or (dual-parse fallback) as inline fields before Scope"
    fix_suggestion: "Wrap metadata block in `---` fences at line 1, or place inline `**Field:**` lines before the `## Scope` header"
    severity: "CRITICAL"
  
  # header block removed in v3.5:
  # `## Metadata` H2 header is no longer required — the YAML frontmatter fence
  # (`---`) at top-of-file replaces it. Inline dual-parse mode does not require
  # the H2 header either.

# ==============================================================================
# DOCUMENT STRUCTURE RULES
# ==============================================================================
structure:
  description: "Document structure validation rules"
  max_lines: 250
  max_fenced_examples: 3
  
  # Single H1 title requirement
  # Note (v3.5): the regex matches the H1 line content only; leading YAML
  # frontmatter block (`---` fences at top-of-file) is tolerated by the parser
  # which locates the first `^# ` line rather than assuming a fixed position.
  title:
    level: 1
    count: 1
    required: true
    pattern: "^# \\d+-[a-z]+-[a-z-]+$"
    error_message: "Must have exactly one H1 title matching pattern: # NNN-technology-aspect"
    fix_suggestion: "Ensure H1 title follows naming convention"
    severity: "CRITICAL"
    docs_reference: "002-rule-governance.md Section 4"
  
  # Required sections with validation rules
  required_sections:
    - name: "Scope"
      level: 2
      order: 1
      required: true
      max_paragraphs: 3
      placement:
        after: "Metadata"
        before: "Contract"
      content_validation:
        required_keywords: ["What This Rule Covers", "When to Load This Rule"]
        min_lines: 5
      error_message: "Scope section is required after Metadata"
      error_group: "Structure"
      severity: "CRITICAL"
      docs_reference: "002-rule-governance.md Section 11.2"
    
    - name: "Contract"
      level: 2
      order: 2
      required: true
      description: "Structured contract using Markdown headers (### subsections)"
      placement:
        after: "Scope"
        max_line_number: 200
        calculate_allowance: true
      content_validation:
        required_subsections:
          - "Inputs and Prerequisites"
          - "Mandatory"
          - "Execution Steps"
          - "Validation"
        no_xml_tags: true
      error_message: "Contract section is required after Scope and before References"
      error_group: "Contract"
      severity: "CRITICAL"
      docs_reference: "002-rule-governance.md Section 11.3"
    
    - name: "References"
      level: 2
      order: 3
      required: true
      placement:
        after: "Contract"
      description: "Focused source links with claim context; state None when no external source applies."
      error_message: "References section is required after Contract"
      error_group: "Structure"
      severity: "HIGH"
  
  # Optional sections
  optional_sections:
    - name: "Examples"
      level: 2
      description: "Optional correct examples only; use focused companions for long examples. No minimum count. Semantic review required."
  
  # Section order validation
  section_order:
    validate_sequence: true
    error_message: "Sections must appear in correct order per schema spec"
    fix_suggestion: "Reorder required sections: Scope, Contract, References"
    severity: "HIGH"

# ==============================================================================
# CONTENT VALIDATION RULES
# ==============================================================================
content_rules:
  description: "Deep content validation beyond structure"
  
  contract:
    section: "Contract"
    validations:
      - type: "required_subsections"
        subsections:
          - name: "Inputs and Prerequisites"
            pattern: "###\\s+Inputs and Prerequisites"
            non_empty: true
          - name: "Mandatory"
            pattern: "###\\s+Mandatory"
            non_empty: true
          - name: "Execution Steps"
            pattern: "###\\s+Execution Steps"
            non_empty: true
          - name: "Validation"
            pattern: "###\\s+Validation"
            non_empty: true
        error_message: "Contract requires Inputs and Prerequisites, Mandatory, Execution Steps, and Validation"
        fix_suggestion: "Missing subsection: ### {subsection_name}"
        severity: "HIGH"
      
      - type: "no_xml_tags"
        forbidden_patterns: ["<inputs_prereqs>", "<mandatory>", "<forbidden>", "<steps>", "<output_format>", "<validation>", "<design_principles>"]
        error_message: "Use Markdown Contract subsection headings; legacy XML contract tags are not supported by this repository"
        fix_suggestion: "Replace XML tags with Markdown headers (###)"
        severity: "HIGH"
      
# ==============================================================================
# PLACEMENT RULES
# ==============================================================================
placement:
  description: "Section placement and positioning rules"
  
  metadata_placement:
    before_section: "Scope"
    error_message: "Metadata must appear before Scope section"
    severity: "CRITICAL"
  
  scope_placement:
    section: "Scope"
    after: "Metadata"
    before: "Contract"
    max_percentage: 5
    error_message: "Scope must be after Metadata and before Contract"
    severity: "CRITICAL"
    docs_reference: "002-rule-governance.md Section 11.2"
  
  references_placement:
    section: "References"
    after: "Contract"
    error_message: "References must follow Contract"
    severity: "CRITICAL"
    docs_reference: "002-rule-governance.md Section 11.2"

# ==============================================================================
# FORMAT RESTRICTIONS
# ==============================================================================
restrictions:
  description: "Format and markup restrictions"
  
  no_numbered_sections:
    enabled: true
    pattern: "^##\\s+\\d+\\."
    error_message: "Use descriptive, unnumbered H2 headings"
    fix_suggestion: "Replace with descriptive section names (e.g., '## Environment and Tooling Requirements')"
    severity: "HIGH"
    docs_reference: "002-rule-governance.md Section 11.2"
  
  no_emojis:
    enabled: true
    # Comprehensive emoji pattern covering multiple Unicode blocks:
    # - U+1F300-U+1F9FF: Emoticons, Miscellaneous Symbols and Pictographs
    # - U+2600-U+26FF: Miscellaneous Symbols (☀️, ⚠️, ✅, ❌, ⚡)
    # - U+2700-U+27BF: Dingbats (✓, ✗, ➜)
    pattern: "[\\U0001F300-\\U0001F9FF\\u2600-\\u26FF\\u2700-\\u27BF]"
    error_message: "Emojis are not allowed in rule files (text-only requirement)"
    fix_suggestion: "Replace emoji with text equivalent: ✅ → [PASS], ❌ → [FAIL], ⚠️ → [WARN]"
    severity: "CRITICAL"
    docs_reference: "002-rule-governance.md Section 11.5"
  
  no_yaml_frontmatter:
    enabled: false  # v3.5: YAML frontmatter is now the canonical metadata format (dual-parse rollout)
    pattern: "^---\\s*$"
    error_message: "YAML frontmatter is not allowed (universal output format)"
    fix_suggestion: "Convert YAML frontmatter to inline **Field:** format"
    severity: "CRITICAL"
    docs_reference: "002-rule-governance.md Section 11"
  
  no_html_comments_in_rules:
    enabled: false  # HTML comments allowed in boilerplate, not in regular rules
    pattern: "<!--.*?-->"
    excluded_files: ["002a-rule-boilerplate.md"]
    error_message: "HTML comments should be removed from rule files"
    severity: "INFO"
  
  universal_format:
    enabled: true
    inline_metadata: true
    no_yaml_blocks: false  # v3.5: YAML frontmatter block allowed for metadata
    markdown_only: true
    error_message: "File must use universal Markdown format"
    severity: "HIGH"

# ==============================================================================
# LINK VALIDATION
# ==============================================================================
link_validation:
  description: "Validate rule references and external URLs"
  
  rule_references:
    enabled: true
    pattern: "rules/[a-zA-Z0-9_-]+\\.md"
    check_exists: true
    allowed_placeholders:
      - "filename.md"
      - "rule-name.md"
      - "NNN-technology-core.md"
      - "000-global-core"
      - "NNN-rule.md"
      - "NNN-new-rule.md"
      - "NNN-technology-aspect.md"
      - "bad-rule.md"
      - "bad-rule-1.md"
      - "bad-rule-2.md"
      - "example.md"
      - "new-rule.md"
      - "215-python-django-core.md"
    error_message: "Referenced rule file does not exist: {file_path}"
    fix_suggestion: "Update reference or create the rule file"
    severity: "MEDIUM"
  
  external_urls:
    enabled: true
    pattern: "^https?://"
    check_reachable: false  # Optional, can be slow - disabled by default
    error_message: "External URL may be broken: {url}"
    severity: "INFO"
  
  references_section:
    # Subsections (### External Documentation, ### Related Rules) recommended but not mandatory
    # References section itself remains required for LLM grounding
    min_items: 1  # At least one reference (URL, rule, or doc)
    error_message: "References section should contain at least one reference"
    severity: "MEDIUM"
    
    # Validation for ### Related Rules subsection
    related_rules_subsection:
      required: false  # Subsection is recommended but optional
      rule_reference_format:
        # Rules can be referenced with or without 'rules/' prefix
        # The rules/ location is defined in the rule-loader protocol for token efficiency
        pattern: "([a-zA-Z0-9_-]+\\.md|rules/[a-zA-Z0-9_-]+\\.md)"
        # Allow root-level project files
        allowed_root_files:
          - "CHANGELOG.md"
          - "CONTRIBUTING.md"
          - "README.md"
        severity: "INFO"
        docs_reference: "002-rule-governance.md Section 11"

# ==============================================================================
# ERROR REPORTING CONFIGURATION
# ==============================================================================
error_reporting:
  description: "Configure error message formatting and grouping"
  
  group_by: "section"  # Group errors by which section they affect
  
  error_groups:
    - "Metadata"
    - "Structure"
    - "Quick Start"
    - "Contract"
    - "Anti-Patterns"
    - "Output Format"
    - "References"
    - "Format"
    - "Links"
  
  show_summary: true
  show_line_numbers: true
  show_context: true
  show_fix_suggestions: true
  
  format: "detailed"  # Options: minimal, standard, detailed
  
  severity_levels:
    CRITICAL:
      weight: 100
      symbol: "❌"
      description: "Must fix - blocking issue"
      fail_validation: true
    
    HIGH:
      weight: 75
      symbol: "⚠️ "
      description: "Should fix - important issue"
      fail_validation: true
    
    MEDIUM:
      weight: 50
      symbol: "ℹ️ "
      description: "Consider fixing - quality issue"
      fail_validation: false
    
    INFO:
      weight: 25
      symbol: "✓"
      description: "Informational - suggestion"
      fail_validation: false
  
  report_header: |
    ================================================================================
    VALIDATION REPORT: {file_path}
    ================================================================================
  
  report_summary: |
    SUMMARY:
      ❌ CRITICAL: {critical_count}
      ⚠️  HIGH: {high_count}
      ℹ️  MEDIUM: {medium_count}
      ✓ Passed: {passed_count} checks
  
  report_footer: |
    ================================================================================
    RESULT: {result_icon} {result_text}
    ================================================================================

# ==============================================================================
# EXCLUDED FILES
# ==============================================================================
excluded_files:
  description: "Files to skip during validation"
  files:
    - "README.md"
    - "CHANGELOG.md"
    - "CONTRIBUTING.md"
    - "UNIVERSAL_PROMPT.md"
    - "002a-rule-boilerplate.md"  # Boilerplate is reference, not validated
    - "002a-rule-template.md"  # Template example (placeholder syntax), not validated
    - "002i-rule-loadtrigger.md"  # DEPRECATED TOMBSTONE — retained for inbound-link stability; no Contract

# ==============================================================================
# VALIDATION BEHAVIOR
# ==============================================================================
validation:
  description: "Global validation behavior settings"
  
  fail_on_warnings: false  # Only fail on CRITICAL and HIGH by default
  strict_mode: false  # Can be enabled via --strict CLI flag
  parallel: false  # Can be enabled for directory validation
  cache_schema: true  # Cache parsed schema for performance
  max_errors_per_file: 100  # Stop after 100 errors to avoid spam
