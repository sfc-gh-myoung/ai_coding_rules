# Test cases for rule-creator skill evaluation
# Following the agent_eval pattern for YAML test case loading

version: "2.0"
description: "Evaluation test cases for rule-creator skill"

test_cases:
  - id: "create-python-rule"
    description: "Create a Python domain rule for a testing library"
    input:
      domain: "python"
      technology: "pytest-asyncio"
      aspect: "core"
      context_tier: "Medium"
    expected:
      validation_passes: true
      has_required_sections:
        - "## Scope"
        - "## Contract"
        - "### Inputs and Prerequisites"
        - "### Mandatory"
        - "### Execution Steps"
        - "### Validation"
        - "## References"
      keyword_count_min: 5
      keyword_count_max: 11
      file_pattern: "rules/2\\d{2}-python-pytest-asyncio.md"
    evaluation_criteria:
      - "Rule file created in correct domain range (200-299)"
      - "V4 section order and four non-empty required Contract subsections"
      - "Keywords within 5-11 range"
      - "ai-rules validate exits with code 0"

  - id: "create-snowflake-rule"
    description: "Create a Snowflake domain rule for a feature"
    input:
      domain: "snowflake"
      technology: "snowflake-dynamic-tables"
      aspect: "core"
      context_tier: "High"
    expected:
      validation_passes: true
      has_required_sections:
        - "## Scope"
        - "## Contract"
        - "### Inputs and Prerequisites"
        - "### Mandatory"
        - "### Execution Steps"
        - "### Validation"
        - "## References"
      keyword_count_min: 5
      keyword_count_max: 11
      file_pattern: "rules/1\\d{2}-snowflake-dynamic-tables.md"
    evaluation_criteria:
      - "Rule file created in correct domain range (100-199)"
      - "V4 section order and four non-empty required Contract subsections"
      - "ai-rules validate exits with code 0"

  - id: "create-javascript-rule"
    description: "Create a JavaScript/Frontend domain rule"
    input:
      domain: "javascript"
      technology: "tanstack-query"
      aspect: "core"
      context_tier: "Medium"
    expected:
      validation_passes: true
      has_required_sections:
        - "## Scope"
        - "## Contract"
        - "### Inputs and Prerequisites"
        - "### Mandatory"
        - "### Execution Steps"
        - "### Validation"
        - "## References"
      keyword_count_min: 5
      keyword_count_max: 11
      file_pattern: "rules/4\\d{2}-tanstack-query.md"
    evaluation_criteria:
      - "Rule file created in correct domain range (400-499)"
      - "V4 section order and four non-empty required Contract subsections"
      - "ai-rules validate exits with code 0"

  - id: "validation-loop-recovery"
    description: "Test validation loop with intentional errors"
    input:
      domain: "python"
      technology: "test-validation"
      inject_errors:
        - type: "keyword_count"
          value: 3  # Below minimum of 5
    expected:
      validation_first_pass: false
      validation_after_fix: true
      max_iterations: 3
    evaluation_criteria:
      - "Skill records the blocking keyword-count diagnostic with its actual severity"
      - "Skill selects relevant typed keywords without filler or unauthorized model calls"
      - "Validation passes within 3 iterations"

  - id: "existing-rule-detection"
    description: "Test pre-flight check for existing rules"
    input:
      domain: "python"
      technology: "python-core"  # Already exists
      aspect: "core"
    expected:
      detects_existing: true
      aborts_creation: true
    evaluation_criteria:
      - "Skill searches rule frontmatter for existing rule"
      - "Skill reports that rule already exists"
      - "Skill does NOT create duplicate rule"

  - id: "frontmatter-discovery"
    description: "Test discovery from rule YAML frontmatter"
    input:
      domain: "shell"
      technology: "zsh-completions"
      aspect: "core"
      context_tier: "Low"
    expected:
      validation_passes: true
      frontmatter_keywords_present: true
      representative_discovery_passes: true
    evaluation_criteria:
      - "Rule created in shell domain (300-399)"
      - "Typed keywords are stored in the rule's YAML frontmatter"
      - "Representative and irrelevant requests exercise actual matcher behavior"
      - "No separate index file is created"

# Scoring rubric for evaluation
scoring:
  validation_passes:
    weight: 30
    description: "Rule passes ai-rules validate with zero CRITICAL and HIGH findings"
  
  section_completeness:
    weight: 25
    description: "V4 required sections are ordered and meaningful, with one completion checklist"
  
  keyword_quality:
    weight: 15
    description: "Keywords are relevant, 5-11 count, aid discovery"
  
  domain_accuracy:
    weight: 15
    description: "Rule placed in correct domain range with proper filename"
  
  discovery_integration:
    weight: 15
    description: "Typed YAML frontmatter supports verified representative discovery"
